
name: Lab 5 - Docker and Kubernetes CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/lab5-ci-cd.yml'
      - 'kubernetes/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ameysawatkar/local-food-wastage-lab5

jobs:
  build-and-deploy:
    name: Build, Publish and Deploy
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Application
        run: |
          python -m py_compile app.py
          python -c "import streamlit, pandas, numpy, plotly, mysql.connector; print('Application dependencies imported successfully')"

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${GITHUB_SHA} .

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Push Docker Image
        run: |
          docker push $IMAGE_NAME:${GITHUB_SHA}

      - name: Load Image into Kind
        run: |
          kind load docker-image $IMAGE_NAME:${GITHUB_SHA} --name cno-lab5

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/food-wastage-app \
            food-wastage-app=$IMAGE_NAME:${GITHUB_SHA} \
            -n cno-lab5

          kubectl rollout status deployment/food-wastage-app \
            -n cno-lab5 --timeout=180s

      - name: Verify Deployment
        run: |
          kubectl get pods -n cno-lab5
          kubectl get deployment food-wastage-app -n cno-lab5
          kubectl get service food-wastage-service -n cno-lab5

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
